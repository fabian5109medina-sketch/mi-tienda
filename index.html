<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRRO DIGITAL | Tienda Definitiva</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --accent-color: #38bdf8; --text-light: #ffffff; --text-muted: #9ca3af; --discount-red: #ef4444; --agotado-bg: #7f1d1d; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-light); margin: 0; padding: 0; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #18181b; padding: 12px 16px; border-bottom: 1px solid #27272a; }
        .logo-area { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1.1em; color: var(--accent-color); cursor: pointer; }
        .nav-icons { display: flex; gap: 15px; font-size: 1.2em; color: #d1d5db; cursor: pointer; }

        .banner { background: linear-gradient(135deg, #1e3a8a, #0f172a); margin: 12px; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #3b82f6; }
        .banner h2 { margin: 0 0 10px 0; font-size: 1.1em; letter-spacing: 1px; color: #fff; }
        .btn-saldo { background: #ffffff; color: #000; border: none; padding: 8px 20px; font-weight: bold; border-radius: 20px; cursor: pointer; font-size: 0.9em; }

        .search-container { padding: 0 12px 15px 12px; }
        .search-box { width: 100%; padding: 10px 12px; background: #18181b; border: 1px solid #3f3f46; color: white; border-radius: 6px; box-sizing: border-box; font-size: 0.9em; }

        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 10px; }
        .product-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid #27272a; display: flex; flex-direction: column; position: relative; }
        .product-card.agotado { opacity: 0.5; filter: grayscale(80%); }
        
        .product-image-container { position: relative; width: 100%; aspect-ratio: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        .product-image-container img { width: 100%; height: 100%; object-fit: contain; padding: 10px; box-sizing: border-box; }
        
        .badge-discount { position: absolute; top: 8px; left: 8px; background: var(--discount-red); color: white; font-size: 0.7em; font-weight: bold; padding: 3px 6px; border-radius: 4px; z-index: 2; }
        .badge-agotado { position: absolute; top: 8px; right: 8px; background: var(--agotado-bg); color: white; font-size: 0.7em; font-weight: bold; padding: 3px 6px; border-radius: 4px; z-index: 2; border: 1px solid #f87171; }
        
        .product-content { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .category { font-size: 0.65em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
        .product-title { font-size: 0.8em; font-weight: 600; color: #fff; margin: 0 0 6px 0; line-height: 1.25em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .price-box { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .old-price { font-size: 0.75em; color: var(--text-muted); text-decoration: line-through; }
        .current-price { font-size: 0.9em; font-weight: bold; color: var(--text-light); }

        .btn-comprar { background: var(--accent-color); color: #000; border: none; padding: 6px; font-weight: bold; font-size: 0.75em; border-radius: 4px; cursor: pointer; width: 100%; text-align: center; }
        .btn-comprar:active { opacity: 0.8; }

        .modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .admin-content { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #3f3f46; max-height: 90vh; overflow-y: auto; text-align: center; }
        .admin-content input, .admin-content select { width: 100%; padding: 10px; margin-bottom: 10px; background: #121212; border: 1px solid #3f3f46; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .admin-content button { background: var(--accent-color); color: #000; border: none; padding: 12px; font-weight: bold; width: 100%; border-radius: 4px; cursor: pointer; margin-top: 5px; }
        
        .footer-text { text-align: center; font-size: 0.7em; color: var(--text-muted); padding: 30px 0; }

</head>

    </div>

    </div>

    <div class="product-grid" id="catalogo"></div>

        Zrrodigital.co © 2026. Todos los Derechos Reservados

            {cat: "COMBOS", title: "Pack Global Streaming 5 Servicios", priceNum: 35000, price: "$35.000", old: "$80.000", desc: "-56%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg"},

            {cat: "CANVA PRO", title: "Canva Pro (1 Mes - Invitación)", priceNum: 6000, price: "$6.000", old: "$15.000", desc: "-60%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/0/08/Canva_icon_2021.svg"},
            {cat: "CANVA PRO", title: "Canva Pro (3 Meses Educativo)", priceNum: 15000, price: "$15.000", old: "$40.000", desc: "-62%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/0/08/Canva_icon_2021.svg"},
            {cat: "CANVA PRO", title: "Canva Pro (1 Año Vitalicio Equipo)", priceNum: 45000, price: "$45.000", old: "$120.000", desc: "-62%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/0/08/Canva_icon_2021.svg"},
            {cat: "IPTV", title: "IPTV Smarters Pro 1 Mes", priceNum: 15000, price: "$15.000", old: "$30.000", desc: "-50%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg"},
            {cat: "IPTV", title: "IPTV Magis TV 3 Meses Oficial", priceNum: 35000, price: "$35.000", old: "$70.000", desc: "-50%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg"},
            {cat: "IPTV", title: "IPTV Tele Latino 1 Año Pack Completo", priceNum: 90000, price: "$90.000", old: "$180.000", desc: "-50%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg"},

            {cat: "OTRAS", title: "Apple TV+ (1 Mes)", priceNum: 10000, price: "$10.000", old: "$22.000", desc: "-54%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg"},
            {cat: "OTRAS", title: "VIX+ Premium Pantalla", priceNum: 8000, price: "$8.000", old: "$18.000", desc: "-55%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg"},
            {cat: "OTRAS", title: "Plex Pass Anual Oficial", priceNum: 40000, price: "$40.000", old: "$90.000", desc: "-55%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg"},
            {cat: "OTRAS", title: "Pornhub Premium VIP Pass (1 Mes)", priceNum: 12000, price: "$12.000", old: "$25.000", desc: "-52%", agotado: false, img: "https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg"}
        ];

        let productos = JSON.parse(localStorage.getItem('zrro_productos_72_v4')) || productosBase;
        let productosFiltrados = [...productos];

        if(usuarioActual && usuarios[usuarioActual]) {
            document.getElementById('modalLogin').style.display = 'none';
            actualizarVistaUsuario();
        }

        function iniciarSesion() {
            let email = document.getElementById('inputEmail').value.toLowerCase().trim();
            if(!email || !email.includes('@')) {
                alert("Por favor ingresa un correo electrónico válido.");
                return;
            }
            if(!usuarios[email]) {
                usuarios[email] = { saldo: 0 };
                localStorage.setItem('zrro_usuarios', JSON.stringify(usuarios));
            }
            usuarioActual = email;
            localStorage.setItem('zrro_sesion_actual', usuarioActual);
            document.getElementById('modalLogin').style.display = 'none';
            actualizarVistaUsuario();
        }

        function actualizarVistaUsuario() {
            document.getElementById('displayEmail').innerText = usuarioActual;
            let saldo = usuarios[usuarioActual] ? usuarios[usuarioActual].saldo : 0;
            document.getElementById('displaySaldo').innerText = "Saldo: $" + saldo.toLocaleString('es-CO');
            renderCatalogo();
        }

        function renderCatalogo() {
            let catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = "";

            productosFiltrados.forEach((p) => {
                let claseAgotado = p.agotado ? 'product-card agotado' : 'product-card';
                let badgeAgotado = p.agotado ? '<span class="badge-agotado">AGOTADO</span>' : '';
                let botonAccion = p.agotado ? 
                    `<button class="btn-comprar" style="background:#3f3f46; color:#a1a1aa; cursor:not-allowed;" disabled>Agotado</button>` : 
                    `<button class="btn-comprar" onclick="comprarServicio('${p.title.replace(/'/g, "\\'")}', ${p.priceNum})">Comprar con Saldo</button>`;

                catalogo.innerHTML += `
                    <div class="${claseAgotado}">
                        <div class="product-image-container">
                            <span class="badge-discount">${p.desc}</span>
                            ${badgeAgotado}
                            <img src="${p.img}" alt="${p.title}">
                        </div>
                        <div class="product-content">
                            <div>
                                <div class="category">${p.cat}</div>
                                <div class="product-title">${p.title}</div>
                            </div>
                            <div>
                                <div class="price-box">
                                    <span class="old-price">${p.old}</span>
                                    <span class="current-price">${p.price}</span>
                                </div>
                                ${botonAccion}
                            </div>
                        </div>
                    </div>
                `;
            });
            actualizarSelectAdmin();
        }

        function comprarServicio(titulo, precioNum) {
            if (!usuarioActual || !usuarios[usuarioActual]) {
                alert("Por favor inicia sesión primero.");
                return;
            }
            let saldoActual = usuarios[usuarioActual].saldo || 0;
            if (saldoActual < precioNum) {
                alert("Saldo insuficiente. Por favor carga saldo para continuar con tu compra.");
                return;
            }
            if (confirm(`¿Confirmas la compra de "${titulo}" por $${precioNum.toLocaleString('es-CO')}?`)) {
                usuarios[usuarioActual].saldo -= precioNum;
                localStorage.setItem('zrro_usuarios', JSON.stringify(usuarios));
                actualizarVistaUsuario();
                alert(`¡Compra exitosa! Has adquirido ${titulo}. Revisa tu cuenta o contacta soporte para entrega inmediata.`);
            }
        }

        function buscarServicios() {
            let query = document.getElementById('buscador').value.toLowerCase();
            productosFiltrados = productos.filter(p => 
                p.title.toLowerCase().includes(query) || p.cat.toLowerCase().includes(query)
            );
            renderCatalogo();
        }

        function abrirAdmin() {
            let pass = prompt("Ingresa la clave de Administrador:");
            if(pass === "1234") {
                document.getElementById('modalAdmin').style.display = 'flex';
            } else if(pass !== null) {
                alert("Contraseña incorrecta");
            }
        }

        function actualizarSelectAdmin() {
            let select = document.getElementById('selectProductoAdmin');
            select.innerHTML = "";
            productos.forEach((p, idx) => {
                select.innerHTML += `<option value="${idx}">${idx + 1}. ${p.title} (${p.agotado ? 'Agotado' : 'Disponible'})</option>`;
            });
        }

        function actualizarSaldoUsuario() {
            let email = document.getElementById('adminEmail').value.toLowerCase().trim();
            let nuevoSaldo = parseInt(document.getElementById('adminSaldo').value);

            if(!email || isNaN(nuevoSaldo)) {
                alert("Ingresa un correo y un saldo válido.");
                return;
            }

            if(!usuarios[email]) {
                usuarios[email] = { saldo: 0 };
            }

            usuarios[email].saldo = nuevoSaldo;
            localStorage.setItem('zrro_usuarios', JSON.stringify(usuarios));
            alert("✅ Saldo actualizado con éxito para " + email);
            
            document.getElementById('adminEmail').value = "";
            document.getElementById('adminSaldo').value = "";
            if(email === usuarioActual) {
                actualizarVistaUsuario();
            }
        }

        function cambiarEstadoProducto() {
            let idx = document.getElementById('selectProductoAdmin').value;
            let estadoVal = document.getElementById('selectEstadoAdmin').value === "true";

            productos[idx].agotado = estadoVal;
            localStorage.setItem('zrro_productos_72_v4', JSON.stringify(productos));
            productosFiltrados = [...productos];
            renderCatalogo();
            alert("✅ Estado del servicio actualizado correctamente.");
        }

        renderCatalogo();
    </script>
</body>
</html>
