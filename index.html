<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRRO DIGITAL | Panel Automatizado</title>
    <style>
        :root { --bg-color: #0b0e14; --card-bg: #161b22; --accent-green: #22c55e; --text-light: #ffffff; --text-muted: #8b949e; --discount-red: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-light); margin: 0; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #30363d; margin-bottom: 20px; }
        .logo { font-weight: bold; font-size: 1.2em; color: #38bdf8; }
        .balance { background: #1c2128; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; border: 1px solid #30363d; }
        .search-box { width: 100%; padding: 12px; background: #161b22; border: 1px solid #30363d; color: white; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; position: relative; border: 1px solid #30363d; }
        .badge { position: absolute; top: 8px; left: 8px; background: var(--discount-red); color: white; font-size: 0.7em; padding: 2px 6px; border-radius: 4px; }
        .card h3 { margin: 20px 0 5px 0; font-size: 0.9em; }
        .card p { font-size: 0.75em; color: var(--text-muted); margin-bottom: 10px; }
        .price { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; display: block; }
        .btn { width: 100%; background: var(--accent-green); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⚡ ZRRO DIGITAL</div>
        <div class="balance">Saldo: $0</div>
    </div>
    <input type="text" class="search-box" placeholder="Buscar servicio (ej: Netflix, Disney)...">
    <div class="grid" id="catalogo">
        <!-- Ejemplo de estructura de tarjeta, esto se repite para los 72 items -->
        <div class="card">
            <span class="badge">-52%</span>
            <h3>NETFLIX</h3>
            <p>1 Pantalla privada Ultra HD con PIN.</p>
            <span class="price">$14.000</span>
            <button class="btn">Comprar</button>
        </div>
        <div class="card">
            <span class="badge">-40%</span>
            <h3>DISNEY+</h3>
            <p>4K Ultra HD y ESPN en vivo incluido.</p>
            <span class="price">$9.000</span>
            <button class="btn">Comprar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyDrP9303f...",
            authDomain: "mi-tienda-56ef5.firebaseapp.com",
            projectId: "mi-tienda-56ef5",
            storageBucket: "mi-tienda-56ef5.appspot.com",
            messagingSenderId: "716772431219",
            appId: "1:716772431219:web:03f3a431c72c17224b6106"
        };
        initializeApp(firebaseConfig);
    </script>
</body>
</html>
