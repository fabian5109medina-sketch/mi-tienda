<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRRO DIGITAL | Tienda Pro</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #38bdf8; --text: #ffffff; --agotado: #7f1d1d; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .modal { display: flex; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .box { background: var(--card); padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; box-sizing: border-box; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: var(--accent); border: none; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; }
        .product-card { background: var(--card); border-radius: 8px; padding: 15px; position: relative; border: 1px solid #333; }
        .agotado { opacity: 0.5; filter: grayscale(1); pointer-events: none; border: 1px solid var(--agotado); }
        .badge-agotado { background: var(--agotado); color: white; padding: 4px 8px; font-size: 10px; font-weight: bold; position: absolute; top: 10px; right: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="modalLogin" class="modal">
    <div class="box">
        <h2>Bienvenido a ZRRO</h2>
        <p>Ingresa tu correo para ver tu saldo</p>
        <input type="email" id="inputEmail" placeholder="usuario@ejemplo.com">
        <button onclick="iniciarSesion()">ACCEDER</button>
    </div>
</div>

<!-- HEADER -->
<div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #18181b;">
    <strong>⚡ ZRRO DIGITAL</strong>
    <div id="userProfile" style="text-align: right;">
        <div id="displayEmail" style="font-size: 10px; color: #888;"></div>
        <div id="displaySaldo" style="font-weight: bold; color: var(--accent);">Saldo: $0</div>
    </div>
    <button onclick="abrirAdmin()" style="width: auto; padding: 5px 10px;">⚙️</button>
</div>

<!-- CATALOGO -->
<div id="catalogo" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px;"></div>

<!-- ADMIN MODAL -->
<div id="modalAdmin" class="modal" style="display:none;">
    <div class="box" style="max-height: 90vh; overflow-y: auto;">
        <h3>Panel Admin</h3>
        <input type="email" id="adminEmail" placeholder="Correo del usuario">
        <input type="number" id="adminSaldo" placeholder="Nuevo saldo (ej: 50000)">
        <button onclick="actualizarSaldo()">ACTUALIZAR SALDO</button>
        <hr style="margin: 20px 0;">
        <label>Alternar estado de producto:</label>
        <select id="selectAgotado"></select>
        <button onclick="toggleEstado()" style="background: #444;">CAMBIAR ESTADO</button>
        <button onclick="document.getElementById('modalAdmin').style.display='none'" style="background: red;">CERRAR</button>
    </div>
</div>

<script>
    let usuarios = JSON.parse(localStorage.getItem('zrro_usuarios')) || {};
    let usuarioActual = null;
    
    // Lista de 72 servicios
    let productos = JSON.parse(localStorage.getItem('zrro_productos_72')) || Array.from({length: 72}, (_, i) => ({
        id: i, title: "Servicio Digital #" + (i+1), price: "$10.000", agotado: false
    }));

    function iniciarSesion() {
        let email = document.getElementById('inputEmail').value.toLowerCase();
        if(!email) return;
        if(!usuarios[email]) usuarios[email] = { saldo: 0 };
        usuarioActual = email;
        localStorage.setItem('zrro_usuarios', JSON.stringify(usuarios));
        document.getElementById('modalLogin').style.display = 'none';
        render();
    }

    function render() {
        let cat = document.getElementById('catalogo');
        cat.innerHTML = "";
        document.getElementById('displayEmail').innerText = usuarioActual;
        document.getElementById('displaySaldo').innerText = "Saldo: $" + (usuarios[usuarioActual]?.saldo || 0).toLocaleString();
        
        productos.forEach((p, index) => {
            cat.innerHTML += `
                <div class="product-card ${p.agotado ? 'agotado' : ''}">
                    ${p.agotado ? '<span class="badge-agotado">AGOTADO</span>' : ''}
                    <div style="font-size: 12px; margin-bottom: 5px;">${p.title}</div>
                    <div style="font-weight: bold; color: var(--accent);">${p.price}</div>
                </div>
            `;
        });

        // Actualizar select admin
        let select = document.getElementById('selectAgotado');
        select.innerHTML = productos.map((p, i) => `<option value="${i}">${p.title} (${p.agotado ? 'Agotado' : 'Disp.'})</option>`).join('');
    }

    function abrirAdmin() {
        if(prompt("Clave Admin:") === "1234") document.getElementById('modalAdmin').style.display = 'flex';
    }

    function actualizarSaldo() {
        let email = document.getElementById('adminEmail').value.toLowerCase();
        let nuevo = parseInt(document.getElementById('adminSaldo').value);
        if(usuarios[email]) {
            usuarios[email].saldo = nuevo;
            localStorage.setItem('zrro_usuarios', JSON.stringify(usuarios));
            alert("¡Saldo actualizado!");
            render();
        } else alert("Usuario no encontrado");
    }

    function toggleEstado() {
        let id = document.getElementById('selectAgotado').value;
        productos[id].agotado = !productos[id].agotado;
        localStorage.setItem('zrro_productos_72', JSON.stringify(productos));
        render();
    }

    render();
</script>
</body>
</html>
