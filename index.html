<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRRO DIGITAL | Tienda</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --accent-color: #38bdf8; --text-light: #ffffff; --text-muted: #9ca3af; --discount-red: #ef4444; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-light); margin: 0; padding: 0; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #18181b; padding: 12px 16px; border-bottom: 1px solid #27272a; }
        .logo-area { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1.1em; color: var(--accent-color); cursor: pointer; }
        .nav-icons { display: flex; gap: 15px; font-size: 1.2em; color: #d1d5db; cursor: pointer; }

        .banner { background: linear-gradient(135deg, #1e3a8a, #0f172a); margin: 12px; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #3b82f6; }
        .banner h2 { margin: 0 0 10px 0; font-size: 1.1em; letter-spacing: 1px; color: #fff; }
        .btn-saldo { background: #ffffff; color: #000; border: none; padding: 8px 20px; font-weight: bold; border-radius: 20px; cursor: pointer; font-size: 0.9em; }

        .filter-bar { display: flex; gap: 8px; padding: 0 12px 12px 12px; overflow-x: auto; }
        .filter-btn, .select-box { background: #27272a; color: #fff; border: 1px solid #3f3f46; padding: 8px 12px; border-radius: 4px; font-size: 0.8em; white-space: nowrap; }
        .search-container { padding: 0 12px 15px 12px; }
        .search-box { width: 100%; padding: 10px 12px; background: #18181b; border: 1px solid #3f3f46; color: white; border-radius: 6px; box-sizing: border-box; font-size: 0.9em; }

        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 10px; }
        .product-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid #27272a; display: flex; flex-direction: column; position: relative; }
        
        .product-image-container { position: relative; width: 100%; aspect-ratio: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        .product-image-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-discount { position: absolute; top: 8px; left: 8px; background: var(--discount-red); color: white; font-size: 0.7em; font-weight: bold; padding: 3px 6px; border-radius: 4px; }
        
        .product-content { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .category { font-size: 0.65em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
        .product-title { font-size: 0.8em; font-weight: 600; color: #fff; margin: 0 0 6px 0; line-height: 1.25em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .stars { color: #d1d5db; font-size: 0.7em; margin-bottom: 6px; }
        
        .price-box { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
        .old-price { font-size: 0.75em; color: var(--text-muted); text-decoration: line-through; }
        .current-price { font-size: 0.9em; font-weight: bold; color: var(--text-light); }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 5px; padding: 20px 0; flex-wrap: wrap; }
        .page-item { background: #27272a; border: 1px solid #3f3f46; color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 0.8em; cursor: pointer; }
        .page-item.active { background: #fff; color: #000; font-weight: bold; }

        /* Botón y Panel de Administración Flotante */
        .admin-float-btn { position: fixed; bottom: 20px; right: 20px; background: var(--accent-color); color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 1.2em; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .admin-content { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #3f3f46; max-height: 90vh; overflow-y: auto; }
        .admin-content h3 { margin-top: 0; color: var(--accent-color); }
        .admin-content input, .admin-content select { width: 100%; padding: 8px; margin-bottom: 10px; background: #121212; border: 1px solid #3f3f46; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .admin-content button { background: var(--accent-color); color: #000; border: none; padding: 10px; font-weight: bold; width: 100%; border-radius: 4px; cursor: pointer; margin-top: 5px; }
        .btn-close { background: #ef4444 !important; color: #fff !important; margin-top: 10px; }

        .footer-text { text-align: center; font-size: 0.7em; color: var(--text-muted); padding-bottom: 30px; }
    </style>
</head>

            <input type="text" id="nuevoPrecio" placeholder="14.000">

            <button onclick="agregarProducto()">Guardar y Agregar Producto</button>
            <button class="btn-close" onclick="cerrarAdmin()">Cerrar</button>
        </div>

            {cat: "COMBOS", title: "Combo Netflix + Max (HBO)", price: "$18.000", old: "$36.000", desc: "-50%", img: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=300"},
            {cat: "COMBOS", title: "Combo Netflix + IPTV Premium", price: "$18.000", old: "$36.000", desc: "-50%", img: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=300"},
            {cat: "COMBOS", title: "Combo Netflix + Disney+", price: "$20.000", old: "$40.000", desc: "-50%", img: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=300"},
            {cat: "COMBOS", title: "Combo Netflix + Plex Premium", price: "$16.000", old: "$32.000", desc: "-50%", img: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=300"}
        ];

        let paginaActual = 1;
        let elementosPorPagina = 12;
        let productosFiltrados = [...productos];

        function renderizarPagina() {
            let catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = "";

            let inicio = (paginaActual - 1) * elementosPorPagina;
            let fin = inicio + elementosPorPagina;
            let itemsPagina = productosFiltrados.slice(inicio, fin);

            if(itemsPagina.length === 0) {
                catalogo.innerHTML = "<p style='grid-column: span 2; text-align:center; color: var(--text-muted); padding: 20px;'>No se encontraron servicios.</p>";
                document.getElementById('paginacion').innerHTML = "";
                return;
            }

            itemsPagina.forEach(p => {
                catalogo.innerHTML += `
                    <div class="product-card">
                        <div class="product-image-container">
                            <span class="badge-discount">${p.desc}</span>
                            <img src="${p.img}" alt="${p.title}">
                        </div>
                        <div class="product-content">
                            <div>
                                <div class="category">${p.cat}</div>
                                <div class="product-title">${p.title}</div>
                                <div class="stars">☆☆☆☆☆</div>
                            </div>
                            <div class="price-box">
                                <span class="old-price">${p.old}</span>
                                <span class="current-price">${p.price}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            renderizarPaginacion();
        }

        function renderizarPaginacion() {
            let totalPaginas = Math.ceil(productosFiltrados.length / elementosPorPagina);
            let paginacion = document.getElementById('paginacion');
            paginacion.innerHTML = "";

            if(totalPaginas <= 1) return;

            for(let i = 1; i <= totalPaginas; i++) {
                paginacion.innerHTML += `<div class="page-item ${i === paginaActual ? 'active' : ''}" onclick="cambiarPagina(${i})">${i}</div>`;
            }

            if(paginaActual < totalPaginas) {
                paginacion.innerHTML += `<div class="page-item" onclick="cambiarPagina(${paginaActual + 1})">&gt;</div>`;
            }
        }

        function cambiarPagina(p) {
            paginaActual = p;
            renderizarPagina();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function cambiarLimite() {
            elementosPorPagina = parseInt(document.getElementById('itemsPorPagina').value);
            paginaActual = 1;
            renderizarPagina();
        }

        function buscarServicios() {
            let query = document.getElementById('buscador').value.toLowerCase();
            productosFiltrados = productos.filter(p => 
                p.title.toLowerCase().includes(query) || p.cat.toLowerCase().includes(query)
            );
            paginaActual = 1;
            renderizarPagina();
        }

        function abrirAdmin() {
            let pass = prompt("Ingresa la clave de Administrador:");
            if(pass === "1234") { // Puedes cambiar tu clave aquí si deseas
                document.getElementById('modalAdmin').style.display = 'flex';
            } else if(pass !== null) {
                alert("Contraseña incorrecta");
            }
        }

        function cerrarAdmin() {
            document.getElementById('modalAdmin').style.display = 'none';
        }

        function agregarProducto() {
            let cat = document.getElementById('nuevoCat').value.toUpperCase();
            let title = document.getElementById('nuevoTitulo').value;
            let price = "$" + document.getElementById('nuevoPrecio').value;
            let old = "$" + document.getElementById('nuevoOldPrecio').value;
            let desc = document.getElementById('nuevoDescuento').value;

            if(!cat || !title || !price) {
                alert("Por favor completa al menos la categoría, título y precio.");
                return;
            }

            let nuevo = {
                cat: cat,
                title: title,
                price: price,
                old: old || "$20.000",
                desc: desc || "-40%",
                img: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=300"
            };

            productos.unshift(nuevo);
            localStorage.setItem('zrro_productos', JSON.stringify(productos));
            productosFiltrados = [...productos];
            
            document.getElementById('nuevoCat').value = "";
            document.getElementById('nuevoTitulo').value = "";
            document.getElementById('nuevoPrecio').value = "";
            document.getElementById('nuevoOldPrecio').value = "";
            document.getElementById('nuevoDescuento').value = "";

            cerrarAdmin();
            renderizarPagina();
            alert("¡Servicio agregado con éxito!");
        }

        // Inicializar al cargar la página
        renderizarPagina();
    </script>
</body>
</html>
