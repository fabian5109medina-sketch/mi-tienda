<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRRO DIGITAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librerías de compatibilidad necesarias para evitar el error de apiKey -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        
        <!-- SECCIÓN DE AUTENTICACIÓN -->
        <div id="auth-section">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-cyan-400">ZRRO DIGITAL</h1>
                <p class="text-slate-400 text-sm mt-1">Inicia sesión para acceder</p>
            </div>
            <input type="email" id="email" placeholder="Correo electrónico" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 mb-3 text-white">
            <input type="password" id="password" placeholder="Contraseña" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 mb-4 text-white">
            <button onclick="handleLogin()" class="w-full bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold py-3 rounded-xl mb-2 transition">Iniciar Sesión</button>
            <button onclick="handleRegister()" class="w-full border border-cyan-500/50 text-cyan-400 font-semibold py-3 rounded-xl transition">Crear Cuenta Nueva</button>
            <div id="auth-error" class="hidden mt-4 bg-red-950/50 border border-red-800 text-red-300 text-xs p-3 rounded-xl text-center"></div>
        </div>

        <!-- SECCIÓN DE DASHBOARD -->
        <div id="dashboard-section" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <h2 class="text-lg font-bold text-cyan-400">ZRRO DIGITAL</h2>
                <button onclick="handleLogout()" class="text-xs bg-slate-800 text-red-400 px-3 py-1.5 rounded-lg border border-red-900/50">Cerrar Sesión</button>
            </div>

            <div class="bg-gradient-to-r from-slate-800 to-slate-900 border border-slate-700/50 rounded-2xl p-6 text-center">
                <p class="text-xs text-slate-400 uppercase tracking-wider">Saldo Disponible</p>
                <h3 id="user-balance" class="text-4xl font-extrabold text-white mt-1">$0.00</h3>
            </div>

            <div class="bg-slate-800/50 border border-slate-800 p-4 rounded-xl">
                <p class="text-sm font-medium">Streaming / Recargas</p>
                <p class="text-xs text-slate-400">Activación inmediata</p>
            </div>

            <!-- PANEL DE ADMINISTRADOR -->
            <div id="admin-panel" class="hidden border border-amber-500/30 bg-amber-950/10 rounded-2xl p-4 space-y-3">
                <h3 class="text-sm font-bold text-amber-400">⚡ Panel de Administración</h3>
                <input type="email" id="admin-target-email" placeholder="Correo del usuario" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                <input type="number" id="admin-amount" placeholder="Monto a recargar" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                <button onclick="adminAddBalance()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded-lg transition">Recargar Saldo</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDRLE96tJIJrRSihMy6w0mOT3p_E8J1N0",
            authDomain: "mi-tienda-56ef5.firebaseapp.com",
            projectId: "mi-tienda-56ef5",
            storageBucket: "mi-tienda-56ef5.appspot.com",
            messagingSenderId: "716772431219",
            appId: "1:716772431219:web:03f3a4312f2c8d234a5d7c"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const adminEmails = ["fabian1590medina@gmail.com"];

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                if (adminEmails.includes(user.email)) document.getElementById('admin-panel').classList.remove('hidden');
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) document.getElementById('user-balance').innerText = `$${(doc.data().balance || 0).toLocaleString()}`;
                });
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
            }
        });

        function handleLogin() {
            auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value)
                .catch(e => { document.getElementById('auth-error').innerText = e.message; document.getElementById('auth-error').classList.remove('hidden'); });
        }

        function handleRegister() {
            auth.createUserWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value)
                .then(u => db.collection('users').doc(u.user.uid).set({email: u.user.email, balance: 0}))
                .catch(e => { document.getElementById('auth-error').innerText = e.message; document.getElementById('auth-error').classList.remove('hidden'); });
        }

        function handleLogout() { auth.signOut(); }

        function adminAddBalance() {
            const email = document.getElementById('admin-target-email').value;
            const amt = parseFloat(document.getElementById('admin-amount').value);
            db.collection('users').where("email", "==", email).get().then(snap => {
                if (snap.empty) { alert("Usuario no encontrado"); return; }
                snap.forEach(d => db.collection('users').doc(d.id).update({balance: (d.data().balance || 0) + amt}));
                alert("¡Saldo recargado!");
            });
        }
    </script>
</body>
</html>
